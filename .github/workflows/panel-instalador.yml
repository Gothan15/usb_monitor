# Panel: construir el instalador .msi y publicarlo.
#
# Cómo se usa:
#   · Release nueva: crea una etiqueta «panel-vX.Y.Z» y empújala
#     (git tag panel-v1.0.0 && git push origin panel-v1.0.0).
#     La acción construye el .msi y lo deja en la Release de esa
#     etiqueta. La versión del instalador sale de la etiqueta.
#   · A mano: pestaña Actions → «Panel — instalador MSI» →
#     Run workflow, indicando la versión. El .msi queda como
#     artefacto de la ejecución (30 días), sin crear Release.
#
# La construcción llama al MISMO Construir-Instalador.ps1 que se
# usa en local (compila el panel, descarga las versiones fijadas
# de PostgreSQL/Node/WinSW y compila el .msi con WiX): lo que sale
# de aquí es el mismo procedimiento de siempre, en una máquina
# Windows de GitHub. Las etiquetas del agente son «agente-v*» y
# las del panel «panel-v*»: no se pisan.
#
# Cada Release del panel lleva DOS instaladores: el ligero de
# siempre y el «completo», que trae dentro el paquete del agente
# vigente (su ejecutable, el empujador y el manifiesto, colocados
# en las carpetas del panel). El paso de preparación descarga la
# Release del agente más reciente y deja el PaqueteDir que la
# variante -Completo de Construir-Instalador.ps1 espera.
name: Panel — instalador MSI

on:
  push:
    tags:
      - "panel-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del instalador (solo en ejecuciones manuales)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Instalar Node.js 22 (para compilar el panel)
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Instalar .NET 8 (para la herramienta WiX)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Calcular la versión del instalador
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/panel-v*') {
            $env:GITHUB_REF_NAME -replace '^panel-v', ''
          } else {
            "${{ inputs.version }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Preparar el paquete del agente (para la variante completo)
        id: paquete
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La Release del agente más reciente trae el zip con los
          # dos ejecutables: se descomprime y se deja el PaqueteDir
          # (los dos exe + el manifiesto con la versión de esa
          # Release) que la variante completo espera.
          #
          # OJO al elegir «la más reciente»: la API de GitHub NO
          # devuelve las Releases por fecha de publicación (manda
          # la fecha del commit de la etiqueta), así que el primer
          # agente-v* de la lista puede ser viejo: en las corridas
          # de la v1.3.0 a la v1.3.2 se descargó la v1.0.9, cuyo
          # zip aún no traía empujador, y el paso moría al
          # copiarlo. Se elige por número de versión.
          $rel = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json |
            Where-Object { $_.tag_name -like 'agente-v*' -and -not $_.draft -and -not $_.prerelease } |
            Sort-Object { [version]($_.tag_name -replace '^agente-v', '') } -Descending |
            Select-Object -First 1
          if (-not $rel) { throw 'No hay ninguna Release del agente publicada: la variante completo no se puede construir.' }
          Write-Host "Release del agente elegida: $($rel.tag_name)"
          $versionAgente = $rel.tag_name -replace '^agente-v', ''
          gh release download $rel.tag_name --pattern 'USBMonitorService-agente-v*.zip' --dir "$env:RUNNER_TEMP\paquete-zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\paquete-desc\USBMonitorService-agente-v$versionAgente.zip" -DestinationPath "$env:RUNNER_TEMP\paquete-desc" -Force
          $dir = 'salida-instalador\paquete'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "$env:RUNNER_TEMP\paquete-desc\USBMonitorService.exe" $dir
          Copy-Item "$env:RUNNER_TEMP\paquete-desc\USBMonitorEmpujador.exe" $dir
          # Si un ejecutable se pierde por el camino, que el paso
          # muera aquí con un mensaje claro y no más abajo
          # disfrazado de otra cosa.
          foreach ($exe in 'USBMonitorService.exe', 'USBMonitorEmpujador.exe') {
            if (-not (Test-Path "$dir\$exe")) { throw "El paquete quedó incompleto: falta $exe tras copiarlo." }
          }
          @{ version = $versionAgente } | ConvertTo-Json | Set-Content "$dir\manifiesto.json" -Encoding utf8
          "dir=$dir" >> $env:GITHUB_OUTPUT

      # Primero el ligero: su .msi se compila antes de que la
      # variante completo copie el paquete al árbol preparado.
      - name: Construir el instalador (ligero)
        shell: pwsh
        run: ./instalador/Construir-Instalador.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Construir el instalador (completo, con el paquete del agente)
        shell: pwsh
        run: ./instalador/Construir-Instalador.ps1 -Version ${{ steps.version.outputs.version }} -Completo -PaqueteDir ${{ steps.paquete.outputs.dir }}

      - name: Guardar los .msi como artefacto de la ejecución
        uses: actions/upload-artifact@v6
        with:
          name: USBMonitor-Panel-${{ steps.version.outputs.version }}
          path: |
            salida-instalador/USBMonitor-Panel-${{ steps.version.outputs.version }}.msi
            salida-instalador/USBMonitor-Panel-${{ steps.version.outputs.version }}-completo.msi
          retention-days: 30

      - name: Publicar los .msi en la Release de la etiqueta
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            salida-instalador/USBMonitor-Panel-${{ steps.version.outputs.version }}.msi
            salida-instalador/USBMonitor-Panel-${{ steps.version.outputs.version }}-completo.msi
          generate_release_notes: true
